<!DOCTYPE html>
<html>
<head>
  <title>Prorai8</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">
    <div class="hero-card">
      <p class="eyebrow">AI-Powered Property Investment Analysis</p>
      <h1>Prorai8</h1>
      <p class="hero-text">
        Search properties and analyze investment deals with auto-filled pricing,
        rent estimates, expenses, and mortgage calculations.
      </p>

      <div class="hero-search">
        <input id="searchInput" placeholder="Search city or address">
        <button class="primary-btn" onclick="goSearch()">Search</button>
      </div>
    </div>
  </div>

  <script>
    function goSearch(){
      const q = document.getElementById("searchInput").value;
      window.location.href = "search.html?q=" + encodeURIComponent(q);
    }
  </script>

</body>
</html>
