<!DOCTYPE html>
<html>
<head>
  <title>Prorai8</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Prorai8</h1>
<p>Search properties and analyze investment deals.</p>

<input id="searchInput" placeholder="Search city or address">
<button onclick="goSearch()">Search</button>

<script>
function goSearch(){
  const q = document.getElementById("searchInput").value
  window.location.href = "search.html?q=" + encodeURIComponent(q)
}
</script>

</body>
</html>
