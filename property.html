<!DOCTYPE html>
<html>
<head>
  <title>Property Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">
    <a href="search.html" class="back-link">← Back to Search</a>

    <div class="property-layout">
      <div class="listing-card">
        <img id="propertyImage" class="listing-image" src="" alt="Property image">
        <div id="property" class="listing-content"></div>
      </div>

      <div class="analyzer-card">
        <h2>Deal Analyzer</h2>

        <div class="calculator-grid">
          <div class="field-group">
            <label for="purchase">Purchase Price ($)</label>
            <input id="purchase" type="number" placeholder="385000">
          </div>

          <div class="field-group">
            <label for="rent">Monthly Rent Estimate ($)</label>
            <input id="rent" type="number" placeholder="2310">
          </div>

          <div class="field-group">
            <label for="expenses">Monthly Expenses Estimate ($)</label>
            <input id="expenses" type="number" placeholder="508">
          </div>
        </div>

        <button class="primary-btn" onclick="calc()">Analyze Deal</button>

        <div class="results-box">
          <p id="mortgageResult"><strong>Monthly Mortgage:</strong> $0.00</p>
          <p id="result"><strong>Monthly Cashflow:</strong> $0.00 | <strong>ROI:</strong> 0.00%</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/calculator.js"></script>
  <script src="js/property.js"></script>

</body>
</html>
